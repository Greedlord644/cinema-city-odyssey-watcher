name: Seat Checker Test


on:
  workflow_dispatch:


jobs:

  test:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install dependencies
        run: |
          pip install requests


      - name: Run seat checker
        run: |
          python seat_checker.py
